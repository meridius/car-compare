name: Scrape and Deploy

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: 'Skip scraping — just rebuild + redeploy from the current release data'
        type: boolean
        default: false
  # Pushes to main only rebuild + redeploy the dashboard from the data already in
  # the rolling release — they NEVER scrape, so a code change can't trigger a
  # mobile.de fetch and get us rate-limited. Only paths that change the built
  # site/data are watched; a real scrape happens on the daily cron or a manual run.
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'build/**'
      - 'scrapers/core/**'
      - 'scrapers/data/reference/**'
      - '.github/workflows/scrape-and-deploy.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Data lives in GitHub Releases, not git (decision 001):
#   - rolling release `data` — current per-source state parquets + built payload,
#     assets clobbered daily
#   - immutable snapshots `data-YYYY-MM` — published on the 1st of each month;
#     the permanent record behind the lazy-loaded archive (decision 001, option C)
# The repo itself stays code-only; frozen seed CSVs cover release-less bootstraps.

jobs:
  # One runner per source — true parallelism across servers. Each leg runs its
  # own adapter, whose internal fuel configurations (EV/ICE, palivo URLs) stay
  # serial. Legs are write-independent: each writes only its own <slug>.parquet.
  scrape:
    # Scrape only on the daily cron or an explicit manual run — never on push, and
    # skippable on a manual run (skip_scrape) — so arbitrary code changes never hit
    # mobile.de. A no-scrape run rebuilds the payload from the existing release state.
    if: ${{ github.event_name != 'push' && github.event.inputs.skip_scrape != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [sauto, autodraft, energycars, mobilede]
    # mobilede talks to an undocumented app endpoint that may die without
    # notice — its failure must not block the daily build (which then falls
    # back to the previous state from the rolling `data` release).
    continue-on-error: ${{ matrix.source == 'mobilede' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install playwright pandas pyarrow beautifulsoup4 aiohttp

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      # sauto and mobilede are aiohttp-only; only the Playwright sources need Chromium.
      - if: matrix.source != 'sauto' && matrix.source != 'mobilede'
        run: playwright install chromium --with-deps

      # Previous state comes from the rolling release; the git-tracked seed CSV
      # remains the fallback when the release (or this asset) doesn't exist yet.
      - name: Download previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data \
            --pattern '${{ matrix.source }}.parquet' \
            --dir scrapers/data/scrapes --clobber \
            || echo "no previous state — seed CSV fallback"

      - run: python -m scrapers.run --source ${{ matrix.source }}

      - uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.source }}
          path: scrapers/data/scrapes/${{ matrix.source }}.parquet
          if-no-files-found: error

  # Join the per-source states, rebuild the payload, publish to the rolling
  # release. Pure pandas+pyarrow — no browser deps. Runs only if every
  # non-soft-fail scrape leg succeeded.
  build:
    needs: scrape
    # Run when scrape succeeded OR was skipped (push / skip_scrape) — just not when
    # it actually failed. On a no-scrape run the payload is rebuilt from the state
    # already in the rolling release.
    if: ${{ always() && needs.scrape.result != 'failure' && needs.scrape.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install pandas pyarrow

      # Yesterday's state + history first (covers a failed mobilede leg)…
      - name: Download previous release data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data \
            --pattern '*.parquet' --pattern 'scrape_history.json' \
            --dir /tmp/release-data --clobber \
            || echo "no release yet — seed fallback"
          if [ -d /tmp/release-data ]; then
            mkdir -p scrapers/data/scrapes site/data
            for src in sauto autodraft energycars mobilede; do
              [ -f "/tmp/release-data/$src.parquet" ] && cp "/tmp/release-data/$src.parquet" scrapers/data/scrapes/
            done
            [ -f /tmp/release-data/scrape_history.json ] && cp /tmp/release-data/scrape_history.json site/data/
          fi

      # …then overlay whatever the scrape legs produced today — only when we
      # actually scraped (on a no-scrape run there are no state-* artifacts).
      - uses: actions/download-artifact@v4
        if: ${{ needs.scrape.result == 'success' }}
        with:
          pattern: state-*
          merge-multiple: true
          path: scrapers/data/scrapes

      - run: python build/build_data.py
        env:
          BUILD_TRIGGER: ${{ github.event_name }}

      # Everything the deploy job puts under site/data — parquet payload, meta,
      # reference.json, scrape_history.json.
      - uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: site/data
          if-no-files-found: error

      - name: Update rolling data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create data \
            --title "Data (rolling)" \
            --notes "Current scraper state + built payload. Assets are clobbered daily; monthly data-YYYY-MM releases are the immutable history." \
            2>/dev/null || true
          gh release upload data --clobber \
            scrapers/data/scrapes/sauto.parquet \
            scrapers/data/scrapes/autodraft.parquet \
            scrapers/data/scrapes/energycars.parquet \
            scrapers/data/scrapes/mobilede.parquet \
            site/data/cars.parquet \
            site/data/cars-archived.parquet \
            site/data/cars-meta.json \
            site/data/reference.json \
            site/data/scrape_history.json

      - name: Monthly immutable snapshot
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            TAG="data-$(date -u +%Y-%m)"
            gh release create "$TAG" \
              --title "Data snapshot $(date -u +%Y-%m)" \
              --notes "Immutable monthly snapshot (see docs/decisions/001-scalable-storage.md)." \
              scrapers/data/scrapes/sauto.parquet \
              scrapers/data/scrapes/autodraft.parquet \
              scrapers/data/scrapes/energycars.parquet \
              scrapers/data/scrapes/mobilede.parquet \
              site/data/cars.parquet \
              site/data/cars-archived.parquet \
              site/data/cars-meta.json \
              site/data/reference.json \
              site/data/scrape_history.json \
              || echo "snapshot $TAG already exists"
          fi

  deploy:
    needs: build
    # Pages only deploys from main; on a feature-branch workflow_dispatch the
    # github-pages environment's branch policy blocks the job and it fails.
    # Skip it on non-main refs so branch runs stay green.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Data is not in git — inject the freshly built payload into the Pages artifact.
      - uses: actions/download-artifact@v4
        with:
          name: site-data
          path: site/data

      - uses: actions/configure-pages@v5

      - name: Cache-bust local assets
        run: |
          V=$(git rev-parse --short HEAD)
          sed -i "s|style\.css\"|style.css?v=$V\"|g" site/*.html
          sed -i "s|app\.js\"|app.js?v=$V\"|g" site/index.html
          sed -i "s|reference\.js\"|reference.js?v=$V\"|g" site/reference.html
          sed -i "s|data/cars\.parquet\"|data/cars.parquet?v=$V\"|g" site/app.js
          sed -i "s|data/cars-archived\.parquet\"|data/cars-archived.parquet?v=$V\"|g" site/app.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
