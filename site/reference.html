<!DOCTYPE html>
<html lang="cs" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referenční modely</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@33.1.1/styles/ag-grid.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@33.1.1/styles/ag-theme-alpine.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Referenční modely</h1>
        <div class="controls">
            <span id="row-count"></span>
            <button id="btn-incomplete" class="btn-incomplete" onclick="toggleIncomplete()"
                title="Zobrazit jen modely s chybějícími klíčovými údaji">Neúplné: – / –</button>
            <button id="btn-theme" onclick="toggleTheme()" title="Přepnout motiv">☾</button>
            <button id="btn-clear" onclick="clearFilters()">Vymazat filtry</button>
            <button id="btn-reset-cols" onclick="resetColOrder()">Reset sloupců</button>
            <button class="nav-link" onclick="location.href='index.html'">Zpět na porovnání</button>
        </div>
    </header>
    <div id="ref-search-bar" class="ref-search-bar">
        <div class="ref-search-input-wrap">
            <input type="text" id="ref-search-input" class="ref-search-input" autocomplete="off"
                placeholder="Hledat model… (značka, model, výkon, objem, typ motoru, výbava)">
            <button type="button" id="ref-search-clear" class="ref-search-clear" title="Vymazat hledání"
                style="display:none;">×</button>
        </div>
    </div>
    <div id="filter-chips-bar" class="filter-chips-bar hidden"></div>
    <div id="grid" class="ag-theme-alpine-dark"></div>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33.1.1/dist/ag-grid-community.min.js"></script>
    <script src="filter-chips.js"></script>
    <script src="reference.js"></script>
</body>

</html>
